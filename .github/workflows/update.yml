name: update lists
on:
  schedule:
    - cron: "47 5 * * *"   # after the 04:15 UTC index build
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -P scripts/grad_lists_test.py
      - run: python -P scripts/grad_lists.py --out .
      - run: python -P scripts/grad_page.py jobs.json . --site https://jordan-belfort-ai.github.io/New-Grad-and-Internships-2027/
      - run: |
          git config user.name "jordan-belfort-ai"
          git config user.email "jordan-belfort-ai@users.noreply.github.com"
          git add README.md INTERNSHIPS.md jobs.json index.html robots.txt sitemap.xml *.txt
          git diff --cached --quiet || git commit -m "Update lists $(date -u +%F)"
          git push
